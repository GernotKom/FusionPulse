<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<title>FusionPulse</title>
</head>
<body>

<header>
  <div class="brand">
    <h1>FusionPulse</h1>
    <small id="status" data-state="busy">Verbinde…</small>
  </div>

  <div class="clock" title="Restzeit bis Schluss der 5-Minuten-Kerze">
    <b id="barclock">--:--</b><span>5m</span>
  </div>

  <span id="regime" class="regime">–</span>

  <div class="counts">
    <span class="g"><b id="gc">0</b></span>
    <span class="y"><b id="yc">0</b></span>
    <span class="r"><b id="rc">0</b></span>
  </div>

  <button id="sound" title="Ton (m)">🔊</button>
  <button id="wake" title="Display wach halten">☀</button>
  <button id="cog" title="Einstellungen">⚙</button>
  <button id="scan" class="primary" title="Neu scannen (Leertaste)">↻</button>
</header>

<section id="rail" class="rail"></section>

<nav>
  <input id="q" placeholder="Coin filtern…  (/)" autocomplete="off" spellcheck="false">
  <select id="f" title="Ampelfilter (1/2/3/0)">
    <option value="">Alle</option>
    <option value="green">Grün</option>
    <option value="yellow">Gelb</option>
    <option value="red">Rot</option>
  </select>
  <select id="iv" title="Scan-Intervall">
    <option value="15000">15 s</option>
    <option value="20000">20 s</option>
    <option value="30000">30 s</option>
    <option value="60000">60 s</option>
  </select>
  <small id="stamp"></small>
</nav>

<main>
  <section id="grid"></section>
  <p class="legend">
    Farbe = Ampel · Balken = Pre-Move · Rahmen leuchtet = Preis in der Einstiegszone ·
    Tasten: <kbd>Leer</kbd> Scan, <kbd>/</kbd> Suche, <kbd>1–3</kbd> Filter, <kbd>z</kbd> nur Zone, <kbd>c</kbd> Top-Plan kopieren
  </p>
</main>

<div id="modal" class="modal"><article><button id="x" aria-label="Schließen">×</button><div id="detail"></div></article></div>

<div id="settings" class="modal"><article class="settings">
  <button id="sClose" aria-label="Schließen">×</button>
  <h2>Einstellungen</h2>
  <label>Konto-Equity (€)<input id="sEquity" type="number" min="100" step="100"></label>
  <label>Risiko pro Trade (%)<input id="sRisk" type="number" min="0.1" max="5" step="0.05"></label>
  <label>Tiefen-Scan (Anzahl Paare, 4–30)<input id="sDeep" type="number" min="4" max="30" step="1"></label>
  <label>Watchlist (immer mitscannen)<input id="sWatch" placeholder="BTC-EUR,ETH-EUR"></label>
  <label>Mindest-Score im Grid<input id="sMin" type="number" min="0" max="10" step="0.5"></label>
  <label class="row"><input id="sZone" type="checkbox"> Nur Coins zeigen, deren Preis gerade in der Zone liegt</label>
  <label>Zugriffs-Token (falls APP_TOKEN gesetzt)<input id="sToken" type="password" autocomplete="off"></label>
  <div class="actions">
    <button class="primary" id="sApply">Übernehmen</button>
    <button id="sExport">Journal als CSV</button>
  </div>
  <small>Alle Werte bleiben lokal auf diesem Gerät. Der API-Key liegt ausschließlich im Worker.</small>
</article></div>

<script src="/app.js"></script>
</body>
</html>
